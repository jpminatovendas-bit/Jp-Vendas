<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — JP Minato</title><style>body{font:16px system-ui;background:#edf2f7;color:#163655;margin:0;display:grid;min-height:100vh;place-items:center}main{background:white;padding:32px;border-radius:16px;width:min(360px,80vw)}input,select,button{box-sizing:border-box;padding:12px;width:100%;margin:8px 0;font:inherit}button{background:#164c75;color:white;border:0;border-radius:6px}#status{color:#a12d27}</style><main><h1>JP Minato</h1><p>Acesse os dados do escritório.</p><form id="login"><label>Quem está operando?<select id="operator" required><option value="">Selecione o usuário</option><option>Jeff</option><option>Lara</option><option>Pai</option></select></label><label id="passwordLabel">Senha de acesso<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="submit">Entrar</button><p id="status" role="status"></p></form><small>O computador do escritório e a VPN precisam estar ligados.</small></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();let b=document.getElementById('submit');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value,operator:document.getElementById('operator').value})});const v=await r.json();if(!r.ok)throw Error(v.error);location.replace('/')}catch(e){document.getElementById('status').textContent=e.message}finally{b.disabled=false}};fetch('/api/login-options').then(r=>r.json()).then(v=>{document.getElementById('passwordLabel').hidden=!v.password_required;document.getElementById('password').required=v.password_required}).catch(()=>{});</script></html>
