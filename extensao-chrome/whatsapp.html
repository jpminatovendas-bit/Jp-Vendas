<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Associar WhatsApp — JP Minato</title><link rel="stylesheet" href="style.css"></head><body><h1>Associar link de WhatsApp</h1><div id="municipality" class="banner"></div><p id="status" role="status"></p><label>Endereço capturado<textarea id="link" readonly rows="3"></textarea></label><p id="number"></p><label id="associationLabel">Associar a um telefone deste contato<select id="association"></select></label><p id="previous"></p><label id="replaceLabel" hidden><input id="replace" type="checkbox"> Substituir o endereço anterior deste WhatsApp</label><label id="dddLabel" hidden><input id="ddd" type="checkbox"> Conferi o DDD diferente e quero manter o número</label><label id="opaqueLabel" hidden><input id="opaque" type="checkbox"> Conferi que este link sem número pertence ao contato indicado</label><p>O link será preservado com seus parâmetros. A captura não confirma conta ativa nem registra envio.</p><div class="actions"><button id="refresh">Recarregar associação</button><button id="save" disabled>Salvar associação</button><button id="close">Fechar</button></div><script src="whatsapp.js"></script></body></html>
